# SP12 — 18/10/2026 : l'extracteur de Baloo (KF 6.31) ouvre une connexion graphique Qt.
# baloo_file, lancé au tout début de la session, n'hérite pas de WAYLAND_DISPLAY : chaque
# baloo_file_extractor échouait à joindre Wayland, retombait sur xcb (xcb-cursor absent)
# et abandonnait (SIGABRT), ~4 fois/s avec un vidage mémoire à chaque fois : +4 W au repos.
# L'indexation n'a pas besoin d'affichage : plateforme Qt hors écran.
[Service]
Environment=QT_QPA_PLATFORM=offscreen
