# Pose le 2026-09-20 apres la coupure a 5 s du 16/09.
#
# Par defaut journald ne synchronise sur disque que toutes les 5 minutes (sauf
# pour les messages de priorite <= err, synchronises aussitot). Quand la machine
# est coupee, tout ce qui n'a pas ete ecrit est perdu : le journal du demarrage
# fautif s'arretait a 5,96 s alors que la machine avait tenu jusqu'a ~35 s.
# On ne pouvait donc pas savoir ce qui tournait au moment de la mort.
#
# 10 s : la fin du journal survit a une coupure, au prix d'une ecriture toutes
# les dix secondes. A retirer si la cause des coupures est trouvee.
[Journal]
SyncIntervalSec=10s
