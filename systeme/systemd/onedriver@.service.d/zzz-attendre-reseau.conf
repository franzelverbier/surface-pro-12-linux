# Cette machine n'a PAS d'horloge materielle : le pilote RTC (rtc@6100, pm8xxx)
# reste bloque en sondage differe, /dev/rtc n'existe pas, hwclock ne trouve rien.
# L'heure est donc fausse au demarrage jusqu'a ce que NTP la corrige -- ce qui
# exige le reseau, lui-meme retarde par le balayage WiFi passif (~20 s).
#
# Or OAuth est signe temporellement. onedriver demarrait a 21,5 s alors que NTP
# ne synchronisait qu'a 33,9 s : Microsoft rejetait le jeton
# (InvalidAuthenticationToken), onedriver forcait une reauthentification, et la
# fenetre de connexion apparaissait. Une fois l'heure juste, les renouvellements
# horaires passent tous sans probleme.
#
# On attend donc DEUX conditions : reseau connecte ET horloge synchronisee.
[Unit]
After=graphical-session.target

[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ $i -lt 120 ]; do [ "$(nmcli -t -f STATE general 2>/dev/null)" = "connected" ] && [ "$(timedatectl show -p NTPSynchronized --value 2>/dev/null)" = "yes" ] && exit 0; sleep 1; i=$((i+1)); done; echo "onedriver: reseau ou horloge non prets apres 120 s, demarrage quand meme" >&2'
Restart=on-failure
RestartSec=15s

# Sans ca, un redemarrage apres plantage echoue silencieusement : le point de
# montage FUSE reste en place, sale, et la nouvelle instance ne peut pas s'y
# greffer. -z = detache meme si occupe.
ExecStopPost=-/usr/bin/fusermount -uz %f
