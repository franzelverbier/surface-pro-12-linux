# La carte apparait vers 3 s ; l'attente d'origine sondait toutes les secondes,
# perdant jusqu'a 1 s a chaque fois. Meme delai de garde total (30 s),
# resolution 100 ms.
[Service]
ExecStartPre=
ExecStartPre=/bin/sh -c 'i=0; while [ $i -lt 300 ]; do grep -q x1e80100 /proc/asound/cards 2>/dev/null && exit 0; sleep 0.1; i=$((i+1)); done; exit 1'
