# Trois entrees GRUB (el1, s2idle, amont-el1) portent modprobe.blacklist=qcom_q6v5_pas :
# le DSP audio n'est pas charge, donc la carte x1e80100 n'apparaitra JAMAIS dans
# /proc/asound/cards. L'attente de 30 s du 20-poll-rapide.conf tourne alors pour rien,
# puis l'unite echoue. Mesure du 16/09 sur amont-el1 : 31,5 s de temps mur, 1,37 s de CPU,
# et un service en rouge dans systemctl --failed.
#
# ExecCondition plutot que ConditionPathExists : au demarrage d'une entree ou l'audio
# FONCTIONNE, la carte n'existe pas encore (elle apparait vers 3 s), donc une condition
# de chemin sauterait l'unite a tort. Et ExecCondition marque l'unite « skipped »
# et non « failed », contrairement a un ExecStartPre qui renvoie 1.
[Service]
ExecCondition=/bin/sh -c '! grep -q qcom_q6v5_pas /proc/cmdline'
