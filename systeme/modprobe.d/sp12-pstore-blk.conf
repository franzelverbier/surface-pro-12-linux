# pstore-blk : vidages noyau sur le disque UFS plutot que sur une DRAM effacee.
#
# ramoops ne retient RIEN sur cette machine : « uncorrectable error in header »
# a chaque demarrage, y compris apres un reset a chaud. Verifie sur 64 des
# 136 demarrages du journal, sans une exception. Voir CHANGELOG 2026-08-27.
#
# best_effort=1 : le pilote UFS n'expose pas de support pstore dedie ; on passe
# par la couche bloc ordinaire. Suffisant hors panique franche.
options pstore_blk blkdev=/dev/disk/by-partlabel/SP12PSTORE best_effort=1 kmsg_size=256 console_size=2048 pmsg_size=64
