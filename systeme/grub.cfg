# Surface Pro 12 (x1p42100) — menu de démarrage
#
# Trié le 2026-09-15. Les neuf entrées d'essai de mainline 7.3 ont été retirées
# du menu ; le fichier d'avant le tri est conservé en entier dans le dépôt sous
# systeme/grub.cfg.avant-tri-20260915, et les noyaux, initramfs et DTB
# correspondants sont toujours dans /boot. Rien n'a été supprimé du disque.
#
# ⚠️ LE DÉFAUT EST DÉSIGNÉ PAR IDENTIFIANT, PAS PAR NUMÉRO. Ajouter ou retirer
# une entrée ne peut donc plus changer ce qui démarre. GRUB compte à partir de 0
# et le menu se lit à partir de 1 : le 15/09, cette ambiguïté a failli coûter
# une conclusion fausse sur un test.
#
# ⚠️ RUPTURE D'ABI DES MODULES — lire avant d'ajouter une entrée.
# La série remoteproc « attach » convertit auto_boot en enum : struct rproc
# grandit de 8 octets. CONFIG_REMOTEPROC est intégré et CONFIG_MODVERSIONS
# désactivé, donc charger un module bâti pour une AUTRE Image écrit au-delà de
# la structure allouée, sans le moindre message.
#
# Trois arbres de modules coexistent, un par chaîne de version :
#   /lib/modules/7.1.0-next-20260626       <- Image, Image-el2audio
#   /lib/modules/7.1.0-next-20260626-nft   <- Image-nft et sa copie figée
#   /lib/modules/7.1.0-next-20260626-rust  <- Image-rust
# Les modules du premier ont été bâtis pour Image-el2audio : toute autre entrée
# qui les utilise doit porter modprobe.blacklist=qcom_q6v5_pas.

set timeout=5
set default=courant

# Police agrandie — l'écran fait 2196 px de large et la police par défaut de
# GRUB y est minuscule. TOUT EST CONDITIONNEL : si l'image GRUB n'a pas ces
# modules ou si le fichier manque, le menu s'affiche exactement comme avant.
# Et même si l'affichage échouait complètement, le délai de 5 s démarre de
# toute façon l'entrée « courant » : cette machine ne peut pas rester bloquée
# sur un menu invisible.
if search --no-floppy --set=fontroot --label SP12ROOT-INT ; then
    if loadfont ($fontroot)/boot/grub/fonts/sp12-36.pf2 ; then
        set gfxmode=auto
        terminal_output gfxterm
    fi
fi

# Maintenir Échap ou une touche fléchée pendant le décompte pour rester au menu.


## 1. SP12 — usage courant  (EL2 + KVM, audio, réseau)
##    Le quotidien depuis le 11/09. DTB déclarant qcom,x1p42100-pdc, donc sans le
##    contournement matériel x1e que notre silicium n'a pas. Modules : -nft.
menuentry "SP12 — usage courant  (EL2 + KVM, audio, réseau)" --id courant {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image-nft root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=3 usbcore.autosuspend=-1 id_aa64mmfr0.ecv=1 pstore.backend=pstore_blk
    initrd /boot/initramfs-nft-diag.img
    devicetree /boot/sp12-el2-pdc-test.dtb
}

## 2. SP12 — secours figé du 20 août  (verbeux)
##    Jeu figé et vérifié octet par octet, que rien ne réécrit. loglevel=7.
##    ⚠️ Partage l'arbre de modules -nft avec l'entrée courante.
menuentry "SP12 — secours figé du 20 août  (verbeux)" --id secours {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image.good-2026-08-20 root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=7 usbcore.autosuspend=-1 id_aa64mmfr0.ecv=1
    initrd /boot/initramfs.good-2026-08-20.img
    devicetree /boot/sp12-el2.good-2026-08-20.dtb
}

## 3. SP12 — repli : DTB d'origine (PDC x1e80100)
##    Identique au quotidien mais avec le DTB d'avant le 11/09. À prendre si les
##    réveils cessent de fonctionner (clavier, USB ou capteurs muets).
menuentry "SP12 — repli : DTB d'origine (PDC x1e80100)" --id dtb-origine {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image-nft root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=3 usbcore.autosuspend=-1 id_aa64mmfr0.ecv=1 pstore.backend=pstore_blk
    initrd /boot/initramfs-nft.img
    devicetree /boot/sp12-el2-audio.dtb
}

## 4. SP12 — EL1 : décodage vidéo, variables EFI
##    Noyau du 26 juin, pas de KVM. C'est ici qu'on relit le décalage RTC et qu'on
##    retrouve /dev/video*. Modules : 7.1.0-next-20260626, d'où la liste noire.
menuentry "SP12 — EL1 : décodage vidéo, variables EFI" --id el1 {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=3 quiet splash usbcore.autosuspend=-1 modprobe.blacklist=qcom_q6v5_pas
    initrd /boot/initramfs-sp12-plymouth.img
    devicetree /boot/sp12.dtb
}

## 5. SP12 — essai : veille s2idle
##    EL1 avec mem_sleep_default=s2idle et hexagonrpc masqué. Jamais essayée.
##    Voir docs/AUDIT-2026-09-14.md.
menuentry "SP12 — essai : veille s2idle" --id s2idle {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=7 usbcore.autosuspend=-1 modprobe.blacklist=qcom_q6v5_pas mem_sleep_default=s2idle systemd.mask=hexagonrpc.service
    initrd /boot/initramfs-sp12-plymouth.img
    devicetree /boot/sp12.dtb
}

## 6. SP12 — essai : noyau Rust
##    7.1.0-next-20260626-rust, arbre de modules à lui. N'apporte rien au projet,
##    gardé comme terrain d'essai. Ne compte pas dans l'expérience des coupures.
menuentry "SP12 — essai : noyau Rust" --id rust {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image-rust root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=3 usbcore.autosuspend=-1 id_aa64mmfr0.ecv=1 pstore.backend=pstore_blk
    initrd /boot/initramfs-rust.img
    devicetree /boot/sp12-el2-pdc-test.dtb
}

## 7. SP12 — essai : mainline 7.3 au ralenti  (diagnostic)
##    Mainline 7.3-rc3, qui ne démarre PAS : la machine se réinitialise pendant
##    les initcall. initcall_debug + boot_delay=15 rendent le défilement filmable.
##    Chercher la dernière ligne « calling » sans son « returned ».
menuentry "SP12 — essai : mainline 7.3 au ralenti  (diagnostic)" --id mainline-diag {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image-7.3rc3 root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=8 initcall_debug boot_delay=15 usbcore.autosuspend=-1 panic=30 pstore.backend=pstore_blk pstore_blk.blkdev=PARTLABEL=SP12PSTORE pstore_blk.best_effort=1 pstore_blk.console_size=8192
    initrd /boot/initramfs-7.3rc3.img
    devicetree /boot/sp12.dtb
}

## 8. SP12 — Shell UEFI  (diagnostic)
menuentry "SP12 — Shell UEFI  (diagnostic)" --id shell {
    search --no-floppy --set=root --label SYSTEM
    chainloader /slbounce/Shell.efi
}

## 9. SP12 — essai : mainline 7.3 sans les contrôleurs geni  (diagnostic)
##    Mainline 7.3-rc3, notre DTB de juin, mais les 54 nœuds « geni » mis à
##    status = "disabled" — donc 9 périphériques réellement actifs en moins.
##
##    POURQUOI CELUI-LÀ. Le plantage est dans un pilote INTÉGRÉ au noyau. Sur les
##    183 compatibles de notre DTB, 21 pilotes seulement sont à la fois intégrés
##    (déclarés par modules.builtin) et modifiés depuis notre base de juin. Le
##    plus réécrit de tous est qcom_geni_serial.c : 703 lignes, loin devant le
##    PDC (540). Et c'est lui qui porte le Surface Aggregator.
##
##    CE QU'ON PERD pendant l'essai : clavier Type Cover, écran tactile, stylet,
##    Bluetooth — tout ce qui passe par les bus geni. L'affichage, le disque UFS
##    et le WiFi PCIe ne sont pas concernés, donc le bureau doit s'afficher.
##    D'où sp12.autoreboot=300 : la machine revient seule au bout de 5 minutes.
##
##    CE QUE ÇA DIT. Démarre → le coupable est dans le chemin geni, et on tient
##    un fichier de 703 lignes à éplucher. Replante → geni est hors de cause et
##    il reste 20 pilotes, dont le PDC.
##
##    DTB fabriqué par systeme/bin/dtb-desactiver-noeuds.js, qui contrôle que le
##    seul écart avec l'original porte sur des propriétés status (9 ici, zéro
##    différence ailleurs).
menuentry "SP12 — essai : mainline 7.3 sans geni  (diagnostic)" --id mainline-sans-geni {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image-7.3rc3 root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=4 usbcore.autosuspend=-1 panic=30 sp12.autoreboot=300
    initrd /boot/initramfs-7.3rc3.img
    devicetree /boot/sp12-sans-geni.dtb
}

## 10. SP12 — essai : mainline 7.3 sans fw_devlink  (diagnostic, 30 secondes)
##     Un seul mot en plus sur la ligne de commande : fw_devlink=off.
##
##     POURQUOI. Les dernières lignes visibles sur la photo du plantage sont des
##     « Fixed dependency cycle(s) with … » : c'est fw_devlink qui casse des
##     cycles de dépendance entre nœuds. Ce mécanisme décide de l'ORDRE dans
##     lequel les pilotes sondent. S'il produit en 7.3 un ordre qui touche un
##     bloc matériel non alimenté, le reset est silencieux et immédiat.
##     fw_devlink=off supprime tout le mécanisme : les pilotes sondent dans
##     l'ordre naturel, avec des reports de sondage au lieu de liens.
##
##     C'est le seul paramètre qui agit directement sur ce que la photo montre,
##     et il ne coûte ni compilation ni film.
##
##     Démarre   → l'ordre de sondage est en cause, et on cherche dans cette
##                 direction plutôt que dans un pilote précis.
##     Replante  → fw_devlink est hors de cause.
##
##     ⚠️ fw_devlink=off peut faire échouer des pilotes qui comptent sur les
##     liens : un démarrage RÉUSSI mais dégradé reste un succès pour ce test.
menuentry "SP12 — essai : mainline 7.3 sans fw_devlink  (diagnostic)" --id mainline-nodevlink {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image-7.3rc3 root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=4 usbcore.autosuspend=-1 panic=30 fw_devlink=off sp12.autoreboot=300
    initrd /boot/initramfs-7.3rc3.img
    devicetree /boot/sp12.dtb
}

## 11. SP12 — essai : noyau CyberMyth 7.2.3  (référence qui marche ailleurs)
##     Le noyau, le device tree et les modules viennent de l'image officielle
##     CyberMyth OS 1.0 (cybermyth.dev), une Debian 13 construite pour CE modèle
##     et rien d'autre. Empreinte SHA256 vérifiée avant extraction.
##     Leur documentation annonce tout fonctionnel — Type Cover, audio, micro,
##     tactile, stylet, caméra, capteurs, plafond de charge — et AUCUN problème
##     de démarrage.
##
##     CE QU'ON TESTE. Nos quatre noyaux 7.3 se réinitialisent pendant les
##     initcall, avec trois device trees différents et deux configurations. Un
##     noyau dont on SAIT qu'il démarre sur ce matériel tranche la question :
##       il démarre   -> ce sont MES compilations qui sont en cause, et j'ai leur
##                       configuration exacte à recopier (elle diffère de la
##                       mienne sur l'adressage virtuel, 48 bits contre 52, les
##                       interruptions non masquables et plusieurs errata) ;
##       il replante  -> le noyau n'y est pour rien, le problème est dans la
##                       chaîne de démarrage de CETTE machine, et slbounce —
##                       enregistré comme pilote UEFI, exécuté à chaque
##                       démarrage, que personne d'autre n'a — devient le
##                       suspect principal.
##
##     Leur DTB déclare le MÊME "qcom,x1e80100-pdc" que le nôtre et démarre :
##     confirmation indépendante que le PDC était hors de cause.
##
##     Rien n'est écrasé : leur noyau, leur DTB et leurs 602 Mo de modules sont
##     posés à côté des nôtres sous des noms distincts, arbre
##     /lib/modules/7.2.3-cybermyth-sp12 propre. L'initramfs est généré par NOTRE
##     mkinitcpio pour notre racine. Leur noyau porte ext4, UFS et UFS-Qualcomm
##     en dur, il n'a donc besoin de rien pour monter /.
##
##     sp12.autoreboot=600 : la machine revient seule au bout de dix minutes,
##     au cas où le clavier ne répondrait pas. Assez pour regarder, pas assez
##     pour rester coincé.
menuentry "SP12 — essai : noyau CyberMyth 7.2.3  (marche ailleurs)" --id cybermyth {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image-cybermyth-7.2.3 root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=4 usbcore.autosuspend=-1 panic=30 sp12.autoreboot=600
    initrd /boot/initramfs-cybermyth.img
    devicetree /boot/sp12-cybermyth.dtb
}
