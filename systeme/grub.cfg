# Surface Pro 12 (x1p42100) — menu de démarrage
#
# ⚠️ RUPTURE D'ABI DES MODULES — lire avant d'ajouter une entrée.
# La série remoteproc « attach » convertit auto_boot en enum : struct rproc
# grandit de 8 octets. CONFIG_REMOTEPROC est intégré et CONFIG_MODVERSIONS
# désactivé, donc charger un module bâti pour une AUTRE Image écrit au-delà de
# la structure allouée, sans le moindre message.
#
# Deux arbres de modules coexistent, un par chaîne de version :
#   /lib/modules/7.1.0-next-20260626       <- Image, Image-el2audio
#   /lib/modules/7.1.0-next-20260626-nft   <- Image-nft et sa copie figée
#
# Les modules du premier ont été bâtis pour Image-el2audio. Toute autre entrée
# qui les utilise doit donc porter modprobe.blacklist=qcom_q6v5_pas.
# Image-nft a son propre arbre, cohérent : pas de blacklist nécessaire.

set timeout=1
set default=5

# Maintenir Échap ou une touche fléchée pendant le décompte pour rester au menu.

## 0 — usage courant : EL2 + KVM, audio, nftables, policy routing
##     Modules dans /lib/modules/7.1.0-next-20260626-nft.
menuentry "SP12 — EL2 / KVM + audio + nftables  (usage courant)" {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image-nft root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=3 usbcore.autosuspend=-1 id_aa64mmfr0.ecv=1 pstore.backend=pstore_blk
    initrd /boot/initramfs-nft.img
    devicetree /boot/sp12-el2-audio.dtb
}

## 1 — SECOURS : copie figée du jeu ci-dessus, validée le 2026-08-20.
##     Rien ne l'écrase à la recompilation. loglevel=7 pour voir ce qui se passe.
##     ⚠️ Partage l'arbre de modules -nft avec l'entrée 0 : une recompilation qui
##     abîmerait ces modules toucherait les deux. L'Image, l'initramfs et le DTB,
##     eux, sont bien indépendants.
menuentry "SP12 — EL2 secours figé 2026-08-20  (verbeux)" {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image.good-2026-08-20 root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=7 usbcore.autosuspend=-1 id_aa64mmfr0.ecv=1
    initrd /boot/initramfs.good-2026-08-20.img
    devicetree /boot/sp12-el2.good-2026-08-20.dtb
}

## 2 — repli d'avant la recompilation du 6 août : noyau du 31 juillet.
##     Pas de nftables ni de policy routing. Pas de blacklist : c'est l'Image
##     pour laquelle les modules de /lib/modules/7.1.0-next-20260626 sont bâtis.
menuentry "SP12 — EL2 / KVM + audio  (noyau du 31 juillet)" {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image-el2audio root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=3 usbcore.autosuspend=-1 id_aa64mmfr0.ecv=1
    initrd /boot/initramfs-sp12-audio.img
    devicetree /boot/sp12-el2-audio.dtb
}

## 3 — EL1 : pas de KVM, mais le décodage vidéo matériel et les variables EFI.
##     C'est ici qu'on relit le décalage RTC quand il a trop dérivé.
menuentry "SP12 — EL1  (sans KVM, décodage vidéo, variables EFI)" {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=3 quiet splash usbcore.autosuspend=-1 modprobe.blacklist=qcom_q6v5_pas
    initrd /boot/initramfs-sp12-plymouth.img
    devicetree /boot/sp12.dtb
}

## 4 — shell UEFI, pour inspecter les drivers et l'ESP
menuentry "SP12 — Shell UEFI  (diagnostic)" {
    search --no-floppy --set=root --label SYSTEM
    chainloader /slbounce/Shell.efi
}

## 5 — TEST PDC (2026-09-11) : identique en tout point à l'entrée 0, SAUF le DTB.
##     Le nœud pdc y déclare "qcom,x1p42100-pdc" au lieu de "qcom,x1e80100-pdc".
##
##     Ce que cela change : qcom-pdc n'active son contournement matériel x1e que
##     sur of_device_is_compatible(node, "qcom,x1e80100-pdc"). Ce contournement
##     détourne les écritures d'activation d'interruption des bancs 0-1 vers la
##     région DRV PRÉCÉDENTE — celle d'un autre client, non décrite dans le
##     device tree — et décale les bancs 2-4. Or les dix interruptions PDC
##     utilisées ici sont toutes sur des broches < 64, donc bancs 0 et 1 : la
##     totalité. Qualcomm indique que le bug est corrigé en silicium sur
##     x1p42100 (commit amont 086eac130a94, 2026-09-04).
##     Vérifié sur cette machine : PDC_VERSION = 3.0.0 < 3.2.0, donc le chemin
##     BANK est bien celui qu'emprunte le pilote, contournement compris.
##
##     Le pilote se lie sur "qcom,pdc" seul (IRQCHIP_MATCH), et ne connaît pas
##     "qcom,x1p42100-pdc" : ce compatible est inerte ici, choisi pour coller à
##     purwa.dtsi amont si la série est reprise un jour.
##
##     ⚠️ Ce qu'on n'a PAS : le reset du PDC du mode secondaire vers pass-through
##     par qcom_scm_io_writel(). Notre pilote n'en fait aucun (0 appel contre 2
##     en amont) — ni avant ni après ce changement. On ne perd donc rien.
##
##     ⚠️ Si les réveils cessent de fonctionner (clavier, USB, capteurs muets
##     après une reprise), c'est que notre silicium a le bug malgré tout :
##     revenir à l'entrée 0, qui est intacte.
##
##     Arbre de modules : /lib/modules/7.1.0-next-20260626-nft, comme l'entrée 0.
##
##     2026-09-11, SECONDE différence avec l'entrée 0 : initramfs-nft-diag.img.
##     Il porte phy-qcom-qmp-pcie.ko instrumenté (impression de skip_init au probe),
##     pour la panne du PHY PCIe qui coûte le WiFi une fois sur huit. Installer le
##     module dans /lib/modules ne suffit pas : c'est la copie de l'initramfs qui
##     est chargée. Régénéré par mkinitcpio, donc il embarque aussi cinq semaines
##     de mises à jour d'util-linux et de la base udev. L'entrée 0 garde, elle,
##     l'initramfs du 6 août intact, et le secours figé aussi.
menuentry "SP12 — TEST PDC sans contournement x1e  (2026-09-11)" {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image-nft root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=3 usbcore.autosuspend=-1 id_aa64mmfr0.ecv=1 pstore.backend=pstore_blk
    initrd /boot/initramfs-nft-diag.img
    devicetree /boot/sp12-el2-pdc-test.dtb
}

## 6 — RUST DANS LE NOYAU (2026-09-13). Entrée d'essai, PAS le défaut.
##     Identique à l'entrée 5 sauf l'Image et son initramfs.
##
##     Noyau bâti avec CONFIG_RUST=y depuis une COPIE de l'arbre source
##     (/data/linux-next-rust) : `make O=` est refusé sur un arbre déjà bâti en
##     place, et `make mrproper` aurait détruit la capacité à produire des modules
##     pour le noyau en service. L'arbre d'origine est donc intact.
##
##     Il porte tous nos correctifs hors-arbre — 0008 (RTC), 0010 (recovery
##     remoteproc) et le diagnostic PHY PCIe — vérifiés dans la copie avant build.
##
##     ⚠️ ARBRE DE MODULES PROPRE : /lib/modules/7.1.0-next-20260626-rust.
##     C'est le point entier de CONFIG_LOCALVERSION="-rust". Ne jamais faire
##     pointer une autre entrée dessus : la série remoteproc « attach » agrandit
##     struct rproc de 8 octets et MODVERSIONS est désactivé, donc un module
##     chargé dans le mauvais noyau écrit au-delà de la structure, sans message.
##
##     ⚠️ `scripts/setlocalversion` ajoute un `+` au vermagic sur un dépôt git.
##     Tout `make` visant ce noyau doit porter
##     KERNELRELEASE=7.1.0-next-20260626-rust — build ET modules_install.
##
##     Deux modules d'exemple sont disponibles pour voir du Rust s'exécuter :
##       sudo modprobe rust_minimal   # puis rmmod, la trace est dans dmesg
##       sudo modprobe rust_print
##
##     ⚠️ Le temps passé sur cette entrée ne compte PAS dans l'expérience des
##     coupures : le noyau n'est pas celui des autres entrées. Voir
##     /data/sp12data/experience-coupures.md.
menuentry "SP12 — noyau Rust  (essai, 2026-09-13)" {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image-rust root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=3 usbcore.autosuspend=-1 id_aa64mmfr0.ecv=1 pstore.backend=pstore_blk
    initrd /boot/initramfs-rust.img
    devicetree /boot/sp12-el2-pdc-test.dtb
}

## 7 — TEST VEILLE s2idle en EL1 (2026-09-14). Entrée d'essai, PAS le défaut.
##     Copie de l'entrée 3 (EL1, Image du 26 juin, modules 7.1.0-next-20260626,
##     blacklist qcom_q6v5_pas obligatoire) avec trois différences :
##       mem_sleep_default=s2idle       la veille passe par s2idle, pas par le
##                                      « deep » PSCI qui ne reprend jamais ici
##       systemd.mask=hexagonrpc.service  le domaine capteurs de l'ADSP ne doit
##                                      jamais être attaché : un rapport sur SP12
##                                      (bglebrun, dépôt Harrison, issue #6,
##                                      7.2-rc2) dit que s2idle reprend proprement
##                                      tant que ce domaine n'a pas été utilisé
##       loglevel=7, sans quiet/splash  pour voir la reprise sur tty0
##
##     Les cibles sleep/suspend restent masquées dans systemd : pour l'essai,
##     depuis un TTY ou SSH,
##       cat /sys/power/mem_sleep            # attendu : [s2idle] deep
##       echo mem | sudo tee /sys/power/state
##     puis une touche ou le bouton pour reprendre. Si l'écran reste noir, bouton
##     maintenu ; rien n'est modifié durablement, l'entrée 5 reste le défaut.
##     Résultat à consigner dans /data/git/surface-pro-12-linux/docs/AUDIT-2026-09-14.md.
menuentry "SP12 — TEST veille s2idle, EL1  (essai, 2026-09-14)" {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=7 usbcore.autosuspend=-1 modprobe.blacklist=qcom_q6v5_pas mem_sleep_default=s2idle systemd.mask=hexagonrpc.service
    initrd /boot/initramfs-sp12-plymouth.img
    devicetree /boot/sp12.dtb
}

## ENTRÉES 8 À 11 — mainline 7.3-rc3. Toutes en essai, aucune n'est le défaut.
##
## Le 2026-09-14, l'entrée 8 a redémarré la machine toute seule pendant le
## démarrage : du texte défile, puis reset. Deux fois. Rien dans le journal
## (journald n'a jamais démarré), rien dans pstore. La photo de l'écran s'arrête
## au milieu des messages « Fixed dependency cycle(s) » des nœuds CoreSight,
## donc pendant la CRÉATION des périphériques du device tree — très tôt.
##
## Ce qui a changé le 2026-09-15 sur ces quatre entrées :
##   loglevel=4     les milliers de lignes d'information disparaissent, donc les
##                  dernières lignes avant le reset restent lisibles à l'écran.
##                  earlycon=efifb a été RETIRÉ : il peignait chaque message une
##                  seconde fois dans le framebuffer et ralentissait tout d'un
##                  facteur trois, ce qui donnait de faux horodatages tardifs.
##   pstore_blk     désormais INTÉGRÉ au noyau 7.3 (=y) et non plus module : il
##                  s'initialise en late_initcall, sans attendre la racine, et
##                  écrit la console sur /dev/sda4 (PARTLABEL=SP12PSTORE).
##                  ⚠️ Cela ne capture rien d'antérieur à late_initcall — si le
##                  reset tombe pendant la création des périphériques, la
##                  partition restera muette et seule la photo parlera.
##   panic=30       si c'est une panique, le texte reste 30 s avant le reset.
##
## ORDRE D'ESSAI, chaque entrée répond à une question précise :
##   10 → est-ce le NOYAU ou le DEVICE TREE ? (noyau 7.3 + notre DTB de juin)
##   11 → si c'est le DTB : est-ce CoreSight ? (DTB amont, 60 nœuds désactivés)
##    8 → DTB amont tel quel, la référence qui a planté
##    9 → EL2, seulement si 8 démarre

## 8 — DTB amont tel quel. C'est l'entrée qui a planté deux fois.
menuentry "SP12 — MAINLINE 7.3-rc3, EL1, DTB amont  (a planté 2x)" {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image-7.3rc3 root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=4 usbcore.autosuspend=-1 panic=30 pstore.backend=pstore_blk pstore_blk.blkdev=PARTLABEL=SP12PSTORE pstore_blk.best_effort=1 pstore_blk.console_size=2048 pstore_blk.kmsg_size=256 pstore_blk.pmsg_size=64
    initrd /boot/initramfs-7.3rc3.img
    devicetree /boot/sp12in-7.3rc3.dtb
}

## 9 — EL2 + KVM, DTB amont avec l'overlay x1-el2.dtbo (zap et iris désactivés,
##     SMMU PCIe okay, pas de qcom,broken-reset : l'attache des DSP repose sur le
##     qcom_pas_attach() de mainline). À ne tenter QUE si l'entrée 8 démarre.
menuentry "SP12 — MAINLINE 7.3-rc3, EL2 / KVM  (essai)" {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image-7.3rc3 root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=4 usbcore.autosuspend=-1 panic=30 pstore.backend=pstore_blk pstore_blk.blkdev=PARTLABEL=SP12PSTORE pstore_blk.best_effort=1 pstore_blk.console_size=2048 pstore_blk.kmsg_size=256 pstore_blk.pmsg_size=64 id_aa64mmfr0.ecv=1
    initrd /boot/initramfs-7.3rc3.img
    devicetree /boot/sp12in-7.3rc3-el2.dtb
}

## 10 — DIAGNOSTIC, à essayer EN PREMIER. Noyau 7.3 mais NOTRE DTB de juin,
##      celui de l'entrée 3, qui démarre sans problème avec le noyau -nft.
##      Démarre   → le noyau 7.3 va bien, le coupable est dans le DTS amont.
