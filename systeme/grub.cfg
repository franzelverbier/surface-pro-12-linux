## 8. SP12 — essai : noyau CyberMyth 7.2.3  (référence qui marche ailleurs)
##    Noyau, device tree et modules de l'image officielle CyberMyth OS 1.0, bâtie
##    pour CE modèle. Tranche la question « mes compilations ou cette machine ? ».
##    sp12.autoreboot=600 : la machine revient seule au bout de dix minutes.
menuentry "SP12 — essai : noyau CyberMyth 7.2.3  (référence qui marche ailleurs)" --id cybermyth {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image-cybermyth-7.2.3 root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=4 usbcore.autosuspend=-1 panic=30 sp12.autoreboot=600
    initrd /boot/initramfs-cybermyth.img
    devicetree /boot/sp12-cybermyth.dtb
}

