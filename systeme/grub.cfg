    linux /boot/Image-7.3rc3 root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=4 usbcore.autosuspend=-1 panic=30 pstore.backend=pstore_blk pstore_blk.blkdev=PARTLABEL=SP12PSTORE pstore_blk.best_effort=1 pstore_blk.console_size=2048 pstore_blk.kmsg_size=256 pstore_blk.pmsg_size=64
    initrd /boot/initramfs-7.3rc3.img
    devicetree /boot/sp12.dtb
}

## 11 — DIAGNOSTIC, à essayer si l'entrée 10 démarre. DTB amont avec les
##      60 nœuds CoreSight mis à status = "disabled" (fabriqué par
##      dtb-sans-coresight.js ; contrôlé : le diff avec le DTB amont ne porte
##      que sur des propriétés status). CoreSight est le suspect parce que
##      l'amont ajoute 19 nœuds que notre DTB n'a pas — le CTCU
##      (qcom,x1e80100-ctcu, dont le pilote n'est même pas compilé ici), deux
##      replicators et deux TMC de plus — et parce que la photo du plantage
##      s'arrête dans cette zone. ⚠️ Nos DTB en portent déjà 55 sans dommage :
##      c'est un suspect, pas une certitude.
menuentry "SP12 — MAINLINE 7.3-rc3, EL1, DTB amont sans CoreSight  (diagnostic)" {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image-7.3rc3 root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=4 usbcore.autosuspend=-1 panic=30 pstore.backend=pstore_blk pstore_blk.blkdev=PARTLABEL=SP12PSTORE pstore_blk.best_effort=1 pstore_blk.console_size=2048 pstore_blk.kmsg_size=256 pstore_blk.pmsg_size=64
    initrd /boot/initramfs-7.3rc3.img
    devicetree /boot/sp12in-7.3rc3-nocs.dtb
}
