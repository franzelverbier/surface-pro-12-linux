# Surface Pro 12 (x1p42100) — menu de démarrage
#
# ⚠️ Les modules remoteproc de /lib/modules sont ceux de Image-el2audio :
# le patch qui convertit auto_boot en enum fait grandir struct rproc de 8 octets.
# CONFIG_REMOTEPROC est intégré et CONFIG_MODVERSIONS est désactivé, donc un
# chargement par une AUTRE Image écrirait au-delà de la structure allouée, sans
# aucun message. D'où modprobe.blacklist=qcom_q6v5_pas sur toutes les entrées
# sauf la première.

set timeout=1
set default=0

# Maintenir Échap ou une touche fléchée pendant le décompte pour rester au menu.

## 1 — usage courant : EL2 + KVM, WiFi interne, audio
menuentry "SP12 — EL2 / KVM + audio  (usage courant)" {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image-el2audio root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=3 usbcore.autosuspend=-1 id_aa64mmfr0.ecv=1
    initrd /boot/initramfs-sp12-audio.img
    devicetree /boot/sp12-el2-audio.dtb
}

## 2 — repli EL2 si la première ne démarre plus : msm et DSP écartés, verbeux
menuentry "SP12 — EL2 / KVM  (repli, msm+dsp écartés, verbeux)" {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image-el2dbg root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=7 usbcore.autosuspend=-1 id_aa64mmfr0.ecv=1 modprobe.blacklist=msm,qcom_q6v5_pas ignore_loglevel
    initrd /boot/initramfs-sp12.img
    devicetree /boot/sp12-el2.dtb
}

## 3 — EL1 : pas de KVM, mais c'est la SEULE façon d'avoir le décodage vidéo
##     matériel (iris ne survit pas à la bascule EL2)
menuentry "SP12 — EL1  (sans KVM, décodage vidéo matériel)" {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=3 quiet splash usbcore.autosuspend=-1 modprobe.blacklist=qcom_q6v5_pas
    initrd /boot/initramfs-sp12-plymouth.img
    devicetree /boot/sp12.dtb
}

## 4 — filet de sécurité : noyau, initramfs et DTB figés, connus bons
menuentry "SP12 — Rescue  (known-good 2026-07-16, tout figé)" {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image.good-2026-07-16 root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=7 usbcore.autosuspend=-1 modprobe.blacklist=qcom_q6v5_pas
    initrd /boot/initramfs-sp12.good-2026-07-16.img
    devicetree /boot/sp12.good-2026-07-16.dtb
}

## 5 — relire ramoops après un gel (DTB dédié avec la zone de trace)
menuentry "SP12 — Lire ramoops  (après un gel)" {
    search --no-floppy --set=root --label SP12ROOT-INT
    linux /boot/Image-el2dbg root=LABEL=SP12ROOT-INT rw rootwait clk_ignore_unused pd_ignore_unused console=tty0 loglevel=4 usbcore.autosuspend=-1 modprobe.blacklist=qcom_q6v5_pas
    initrd /boot/initramfs-sp12.img
    devicetree /boot/sp12-ramoops.dtb
}

## 6 — shell UEFI, pour inspecter les drivers et l'ESP
menuentry "SP12 — Shell UEFI  (diagnostic)" {
    search --no-floppy --set=root --label SYSTEM
    chainloader /slbounce/Shell.efi
}
