# SP12 — 30/09/2026 : gels d'écran de 1 à 2 s mesurés (30 à 50 blocages de
# compactage par seconde, zone Normal entre min et low) pendant un rsync vers
# le montage onedriver. Un facteur 200 (défaut 10) écarte les seuils de 2 % de
# la RAM : kswapd libère en arrière-plan avant que les processus (KWin compris)
# ne doivent récupérer eux-mêmes. Retour arrière : supprimer ce fichier.
vm.watermark_scale_factor = 200
