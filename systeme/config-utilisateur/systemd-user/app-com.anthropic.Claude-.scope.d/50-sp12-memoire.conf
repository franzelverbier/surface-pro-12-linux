# SP12 — 02/10/2026 : le 02/10 à 09:10, un grep -rla lancé par une session Claude a
# atteint 11,2 Go ; avec OOMPolicy=stop (défaut), systemd a ensuite arrêté TOUTE
# l'application. Ici : seule la commande fautive est tuée (continue), et l'ensemble
# des sessions ne peut plus dépasser 8 Go (freinage à partir de 7 Go).
# Usage normal mesuré : ~3,4 Go. Retour arrière : supprimer ce fichier.
[Scope]
MemoryHigh=7G
MemoryMax=8G
OOMPolicy=continue
