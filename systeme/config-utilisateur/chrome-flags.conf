# Caméras SP12 via PipeWire/libcamera (sans ce flag Chrome lit les nœuds V4L2 bruts de CAMSS et ne trouve rien)
--enable-features=WebRtcPipeWireCamera

# Ajouté le 28/09/2026 : sans lui Chrome tourne sous XWayland alors que la session
# est Wayland. La capture d'écran fait alors des recopies supplémentaires au lieu
# d'emprunter le chemin PipeWire du compositeur — à 2196x1464 et 30 img/s cela
# représente environ 390 Mo/s évitables. Suspect principal des ralentissements au
# partage d'écran Meet.
# Si la mise à l'échelle ou la saisie se comportent mal, retirer cette ligne :
# sauvegarde dans chrome-flags.conf.avant-wayland-20260928
--ozone-platform-hint=auto
